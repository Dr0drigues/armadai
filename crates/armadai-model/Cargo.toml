[package]
name = "armadai-model"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical ArmadAI project model: strict types, loader and validator"

[dependencies]
serde = { workspace = true }
# preserve_order: `native` keeps the author's key order even when built alone
serde_json = { workspace = true, features = ["preserve_order"] }
serde-saphyr = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
# the binary enables it: test NativeValue under the same number representation
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
tempfile = { workspace = true }
