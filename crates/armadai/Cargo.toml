[package]
name = "armadai"
version = "1.0.0-rc.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ArmadAI — declarative agent teams. Describe agents once in Markdown or YAML, compile them for Claude Code, Codex, OpenCode and Copilot."
default-run = "armadai"

[[bin]]
name = "armadai"
path = "src/main.rs"

[dependencies]
# Workspace crates
armadai-core = { path = "../armadai-core" }
armadai-model = { path = "../armadai-model" }
armadai-providers = { path = "../armadai-providers" }
armadai-secrets = { path = "../armadai-secrets" }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = { workspace = true, features = ["fuzzy-select"] }

# HTTP client (starter archives)
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

# Legacy agent Markdown, read the way armadai-core parses it (migrate)
pulldown-cmark = { workspace = true }

# Embedded agent templates
include_dir = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = { workspace = true }

# Utils
chrono = { version = "0.4", features = ["serde"] }
sha2 = { workspace = true }
# migrate --dry-run validates in a scratch directory
tempfile = { workspace = true }
anstyle = "1.0.14"
anstream = "1.0.0"

[dev-dependencies]
armadai-core = { path = "../armadai-core", features = ["test-support"] }
assert_cmd = "2.2.2"
tempfile = { workspace = true }
