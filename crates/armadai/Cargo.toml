[package]
name = "armadai"
version = "1.0.0-rc.13"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ArmadAI — declarative agent teams. Describe agents once in Markdown or YAML, compile them for Claude Code, Codex, OpenCode and Copilot."
default-run = "armadai"

[[bin]]
name = "armadai"
path = "src/main.rs"

[dependencies]
# Workspace crates
armadai-core = { path = "../armadai-core" }
armadai-model = { path = "../armadai-model" }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = { workspace = true, features = ["fuzzy-select"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }

# Legacy agent Markdown, read the way armadai-core parses it (migrate)
pulldown-cmark = { workspace = true }

# Embedded agent templates
include_dir = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = { workspace = true }

# Utils
chrono = { version = "0.4", features = ["serde"] }
sha2 = { workspace = true }
# migrate --dry-run validates in a scratch directory
tempfile = { workspace = true }
anstyle = "1.0.14"
anstream = "1.0.0"
ascii-dag = "0.11"
base64 = "0.22"
miniz_oxide = "0.9.1"
# pack versions: ordering and ranges
semver = "1"

# term.rs: terminal size and the cursor restored on Ctrl-C
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
armadai-core = { path = "../armadai-core", features = ["test-support"] }
assert_cmd = "2.2.2"
tempfile = { workspace = true }
