[package]
name = "armadai"
version = "1.0.0-rc.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ArmadAI — AI agent orchestrator. Define, manage and run specialized agents from Markdown files."
# This package ships two bins (armadai + fake-claude); default `cargo run` to the main one.
default-run = "armadai"

[[bin]]
name = "armadai"
path = "src/main.rs"

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"
required-features = ["e2e-fake"]

[[test]]
name = "gaveldrop"
required-features = ["e2e-fake"]

[features]
default = ["tui", "web", "storage", "providers-api"]
tui = ["dep:ratatui", "dep:crossterm", "dep:portable-pty", "dep:strip-ansi-escapes", "dep:unicode-width"]
web = ["dep:axum", "dep:tower-http"]
storage = ["dep:armadai-storage", "dep:rusqlite"]
providers-api = ["dep:reqwest", "armadai-providers/api"]
e2e-fake = ["dep:armadai-fake"]

[dependencies]
# Workspace crates
armadai-core = { path = "../armadai-core" }
armadai-providers = { path = "../armadai-providers" }
armadai-secrets = { path = "../armadai-secrets" }
armadai-storage = { path = "../armadai-storage", optional = true }
armadai-fake = { path = "../armadai-fake", optional = true, features = ["engine"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = { workspace = true, features = ["fuzzy-select"] }

# TUI (optional — enable with `tui` feature)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
unicode-width = { version = "0.2", optional = true }

# HTTP client (optional — enable with `providers-api` feature)
reqwest = { workspace = true, optional = true }

# HTTP server (optional — enable with `web` feature)
axum = { version = "0.8", optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

# Database (optional — enable with `storage` feature)
rusqlite = { workspace = true, optional = true }

# Markdown parsing
pulldown-cmark = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Embedded assets
include_dir = { workspace = true }

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }

# PTY support (for interactive shell mode)
portable-pty = { version = "0.8", optional = true }
strip-ansi-escapes = { version = "0.2", optional = true }
regex = "1"
anstyle = "1.0.14"
anstream = "1.0.0"

[dev-dependencies]
armadai-core = { path = "../armadai-core", features = ["test-support"] }
armadai-fake = { path = "../armadai-fake", features = ["engine"] }
assert_cmd = "2.2.2"
gaveldrop = { git = "https://github.com/Dr0drigues/gaveldrop.git", tag = "v0.1.5" }
gaveldrop-fake = { git = "https://github.com/Dr0drigues/gaveldrop.git", tag = "v0.1.5" }
gaveldrop-conformance = { git = "https://github.com/Dr0drigues/gaveldrop.git", tag = "v0.1.5" }
tempfile = { workspace = true }
