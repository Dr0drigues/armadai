[package]
name = "armadai"
version = "1.0.0-rc.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ArmadAI — AI agent orchestrator. Define, manage and run specialized agents from Markdown files."
default-run = "armadai"

[[bin]]
name = "armadai"
path = "src/main.rs"

[features]
default = ["providers-api"]
providers-api = ["dep:reqwest", "armadai-providers/api"]

[dependencies]
# Workspace crates
armadai-core = { path = "../armadai-core" }
armadai-providers = { path = "../armadai-providers" }
armadai-secrets = { path = "../armadai-secrets" }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = { workspace = true, features = ["fuzzy-select"] }

# HTTP client (optional — enable with `providers-api` feature)
reqwest = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

# Markdown parsing
pulldown-cmark = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utils
chrono = { version = "0.4", features = ["serde"] }
sha2 = { workspace = true }
regex = "1"
anstyle = "1.0.14"
anstream = "1.0.0"

[dev-dependencies]
armadai-core = { path = "../armadai-core", features = ["test-support"] }
assert_cmd = "2.2.2"
tempfile = { workspace = true }
