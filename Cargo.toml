[workspace]
members = ["crates/*"]
# Frozen, standalone package (own `[workspace]`): not built by CI or root `cargo test`.
exclude = ["frozen/armadai-audit"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Dr0drigues/swarm-festai"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
serde-saphyr = "1.3.0"
tokio = { version = "1" }
tracing = "0.1"
pulldown-cmark = "0.13"
include_dir = "0.7"
dialoguer = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tempfile = "3"
sha2 = "0.11"
schemars = "1.2.2"
