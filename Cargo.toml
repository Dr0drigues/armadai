[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Dr0drigues/swarm-festai"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1" }
tokio-stream = { version = "0.1", features = ["io-util"] }
tracing = "0.1"
pulldown-cmark = "0.13"
include_dir = "0.7"
dialoguer = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1" }
tempfile = "3"
