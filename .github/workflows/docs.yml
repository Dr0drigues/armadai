# Docs — build the mdBook site and deploy it to GitHub Pages
#
# `book.toml` lives at repo root (src = "docs/wiki", theme = "docs/theme").
# `mdbook build` (no path argument) reads it from the root and writes the
# static site to `book/` at repo root — that is what gets uploaded as the
# Pages artifact.
#
# Triggers on pushes to master that touch the book sources/config, or the
# workflow file itself, plus manual dispatch.
#
# One-time manual step (not covered by this workflow): GitHub Pages must be
# enabled with source = "GitHub Actions" in repo Settings → Pages before the
# deploy job can publish anything.

name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        run: |
          MDBOOK_VERSION=0.4.40
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin

      - name: Build
        run: mdbook build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: book

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
