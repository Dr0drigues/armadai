# Security Audit — Dependency vulnerability scanning
#
# Scans Cargo dependencies for known security vulnerabilities
# using cargo-audit (RustSec Advisory Database).
#
# Catches issues like:
# - CVEs in transitive dependencies
# - Yanked crates still in use
# - Unmaintained dependencies
#
# Runs on: every push to master, every PR, and daily at 06:00 UTC

name: Security Audit

on:
  push:
    branches: [master, "release/**", "refactor/**"]
  pull_request:
    branches: [master, "release/**", "refactor/**"]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  # `rustsec/audit-check` creates a check-run to surface advisories as
  # annotations. On `push` events that requires `checks: write`; without it
  # the action fails with "Resource not accessible by integration" even when
  # the audit itself is clean.
  checks: write

jobs:
  audit:
    name: Audit Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deny: vulnerabilities
