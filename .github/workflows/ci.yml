# CI — Quality gate on every push and pull request
#
# Ensures the code:
# 1. Compiles on stable Rust (build)
# 2. Passes all tests (test)
# 3. Has no lint warnings (clippy with -D warnings)
# 4. Follows formatting conventions (rustfmt)
# 5. Commit messages follow Conventional Commits (on PRs)
#
# Runs on: every push to master, every pull request
#
# Performance strategy:
# - The only optional dep group left is `providers-api` (reqwest)
# - clippy/test run featureless and with `providers-api`
# - build --release compiles the featureless binary
# - Swatinem/rust-cache caches ~/.cargo and target/ between runs
# - Cache is shared across clippy/test/build via shared-key
# - Cache is only saved on master pushes (save-if), PRs read from it

name: CI

on:
  push:
    branches: [master, "release/**", "refactor/**"]
  pull_request:
    branches: [master, "release/**", "refactor/**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The repo root is a VIRTUAL workspace (no root package), so a bare
      # `cargo clippy` lints EVERY member crate (armadai + core/providers/
      # secrets), test targets included via `--all-targets` — the
      # explicit `-p` steps this replaces are no longer needed.
      #
      # We run every feature combination the code is gated for so a lint that
      # only trips under one combo is caught in CI, not just locally. The
      # feature flags belong to the bin and propagate to the member crates,
      # so these combos also cover armadai-providers in BOTH states: the
      # featureless run builds it without `api` (the
      # `#[cfg(not(feature = "api"))]` fallbacks), `providers-api` builds it
      # with `api` (HTTP providers + online model_registry).
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features providers-api -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The repo root is a VIRTUAL workspace, so each `cargo test` below runs
      # the WHOLE workspace (bin + core/providers/secrets); the bin's
      # feature flags propagate to the member crates. The modes together
      # exercise every crate in every gated state — no explicit `-p` steps needed.
      #
      # featureless: baseline (bin + all members; armadai-providers without `api`).
      - run: cargo test --no-default-features
      # providers-api: the crate's default feature set — exercises the bin's
      # providers-api-gated code (linker/cli) AND armadai-providers WITH `api`
      # (HTTP providers + online model_registry).
      - run: cargo test --no-default-features --features providers-api

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo-release
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Release build of the featureless binary.
      - run: cargo build --release --no-default-features
      # Portability guard (OH7): the reusable core must compile standalone,
      # featureless, with no heavy deps (no reqwest) —
      # this is what OH2/the Claude Code plugin will depend on. A dep leaking
      # into core (e.g. via unintended feature unification) fails here.
      - run: cargo build -p armadai-core

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install commitizen
      - name: Check PR commits
        run: |
          cz check --rev-range origin/${{ github.base_ref }}..HEAD
