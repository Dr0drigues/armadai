# Release — Cross-platform binary builds on git tag
#
# Builds optimized binaries for:
# - Linux x86_64 (GNU)
# - Linux aarch64 (GNU, via cross-rs)
# - macOS x86_64 (Intel Macs)
# - macOS aarch64 (Apple Silicon)
# - Windows x86_64 (MSVC)
#
# Creates a GitHub Release with all binaries attached.
# Trigger: push a semver tag like v0.1.0
#
# Usage: rename `## Unreleased` in CHANGELOG.md to `## v0.1.0 (YYYY-MM-DD)` and
# commit it first — the release notes are that section, and the run fails
# without it. Then:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Dry run (no tag, nothing published): `gh workflow run release.yml`, then
# `gh run download <run-id> -n release-dry-run` for the binaries and SHA256SUMS.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: armadai-linux-x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: armadai-linux-aarch64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: armadai-macos-x86_64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: armadai-macos-aarch64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: armadai-windows-x86_64.exe
            use_cross: false

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/armadai dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/armadai.exe" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # Checked first, so a tag without its CHANGELOG section fails before the builds.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the CHANGELOG section
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            .github/scripts/release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md > /dev/null
          fi

  release:
    name: Create Release
    needs: [notes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The notes are the tag's section of the hand-written CHANGELOG.md; a tag
      # without one fails here. A dry run previews `## Unreleased` and only warns.
      - name: Release notes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            .github/scripts/release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md > RELEASE_NOTES.md
          elif ! .github/scripts/release-notes.sh --unreleased CHANGELOG.md > RELEASE_NOTES.md; then
            echo "::warning::no release notes: the Unreleased section of CHANGELOG.md is missing or empty"
          fi
          cat RELEASE_NOTES.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # `armadai update` and install.sh refuse a release without this file.
      - name: Checksums
        run: |
          mkdir -p dist
          cp artifacts/*/armadai-* dist/
          (cd dist && sha256sum armadai-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Keep the dry-run files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: dist/

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/armadai-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
